name: Build & Release Android APK

on:
  push:
    branches: [ "**" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Smart Alarm Optimized APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Optimized Release & Debug APKs
        run: |
          ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Prepare APK Outputs
        run: |
          mkdir -p output_apks
          # Find and copy release APK
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" output_apks/SmartAlarm-v3.0-Release.apk
            echo "RELEASE_APK=output_apks/SmartAlarm-v3.0-Release.apk" >> $GITHUB_ENV
          fi
          
          # Find and copy debug APK
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" output_apks/SmartAlarm-v3.0-Debug.apk
            echo "DEBUG_APK=output_apks/SmartAlarm-v3.0-Debug.apk" >> $GITHUB_ENV
          fi

      - name: Upload Artifacts (Action Summary)
        uses: actions/upload-artifact@v4
        with:
          name: SmartAlarm-APKs
          path: output_apks/*.apk
          retention-days: 14

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v3.0-latest"
          name: "Smart Alarm v3.0 Latest Release (Direct APK)"
          body: |
            ## 🚨 Smart Alarm v3.0 — Direct APK Download
            
            ### ✨ What's New:
            - **🎨 Colorful Simon Says Game**: Vibrant neon buttons with distinct musical synthesizer sound effects for each color.
            - **👀 Realtime Face & Eye Awake Detection**: Instant, lightning-fast wake-up recognition.
            - **✨ Animated Modern Splash Screen**: Sleek cyber pulsing startup animation.
            - **💎 Modern Cyberpunk UI**: Smooth animations, card elevations, and glassmorphic HUD.
            - **⚡ Smallest App Size**: Fully optimized with R8/ProGuard shrinking for lowest footprint and fastest cold startup.
            
            ### 📥 Direct APK Download:
            Download the `.apk` file directly below to install on your Android device!
          files: |
            output_apks/SmartAlarm-v3.0-Release.apk
            output_apks/SmartAlarm-v3.0-Debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
